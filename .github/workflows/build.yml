name: Build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y make unzip tar wget python3 python3-pip python3-serial
      
      - name: Cache toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: /opt/xtensa-lx106-elf
          key: toolchain-${{ runner.os }}-20240225
      
      - name: Download toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/nodemcu/nodemcu-toolchain/releases/download/2019-07-31/xtensa-lx106-elf-linux64-20190731.tar.gz
          sudo mkdir -p /opt/xtensa-lx106-elf
          sudo tar -xf xtensa-lx106-elf-linux64-20190731.tar.gz -C /opt/xtensa-lx106-elf
      
      - name: Build firmware
        run: |
          export PATH=/opt/xtensa-lx106-elf/bin:$PATH
          make clean
          make -j$(nproc)
      
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: nodemcu-firmware
          path: bin/
